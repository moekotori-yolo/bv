name: Alpha Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      application_id:
        description: >
          applicationId。必须与 GOOGLE_SERVICES_JSON 里的某个 package_name
          一致。留空则用 APPLICATION_ID secret。
        required: false
        default: ''

permissions:
  contents: write

# applicationId 决定最终 APK 的包名，也决定 google-services.json 走哪个条目。
# 不匹配时 google-services 插件会报 "No matching client found for package name"。
env:
  BV_APPLICATION_ID: ${{ inputs.application_id || secrets.APPLICATION_ID || secrets.BV_APPLICATION_ID }}

concurrency:
  group: alpha-${{ github.ref }}
  # develop 上连续推送时只保留最新一次构建，避免 Releases 被中间版本刷屏。
  cancel-in-progress: true

jobs:
  build-alpha:
    name: Build Alpha APK
    runs-on: ubuntu-latest
    # 上游用 `if: github.repository == 'aaa1115910/bv'` 把 fork 整个跳过了。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request == null }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up build
        uses: moekotori-yolo/bv/.github/actions/setup-build@feature-customisation-0001
        with:
          variant: alpha
          sign: 'true'
          google-services: 'true'
          # secrets 上下文只在 workflow 里可用，必须在这里展开后传给 composite action。
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          signing-properties: ${{ secrets.SIGNING_PROPERTIES }}
          sign-key: ${{ secrets.SIGN_KEY }}

      - name: Build APKs
        timeout-minutes: 60
        run: |
          set -euo pipefail
          ./gradlew assembleDefaultAlpha assembleDefaultDebug --stacktrace --no-daemon

      - name: Collect APKs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          # 输出文件名随版本号变化，用 glob 而不是硬编码路径。
          shopt -s nullglob
          alpha_apks=(app/build/outputs/apk/default/alpha/*.apk)
          debug_apks=(app/build/outputs/apk/default/debug/*.apk)

          if [[ ${#alpha_apks[@]} -eq 0 ]]; then
            echo "::error::没有找到 alpha APK。实际产物目录内容："
            find app/build/outputs/apk -type f 2>/dev/null || echo "(apk 输出目录不存在)"
            exit 1
          fi
          if [[ ${#debug_apks[@]} -eq 0 ]]; then
            echo "::warning::没有找到 debug APK，本次只发布 alpha 包。"
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${alpha_apks[@]}"
            if [[ ${#debug_apks[@]} -gt 0 ]]; then
              printf '%s\n' "${debug_apks[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "产物清单："
          ls -la app/build/outputs/apk/default/alpha/ app/build/outputs/apk/default/debug/ 2>/dev/null || true

      - name: Read version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          META="app/build/outputs/apk/default/alpha/output-metadata.json"
          if [[ -f "$META" ]]; then
            echo "version_code=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_OUTPUT"
            echo "version_name=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_OUTPUT"
          else
            BASE="$(basename "${{ steps.collect.outputs.files }}" .apk)"
            echo "version_code=$(echo "$BASE" | cut -d_ -f2)" >> "$GITHUB_OUTPUT"
            echo "version_name=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine tag name
        id: tag_name
        shell: bash
        run: |
          set -euo pipefail
          # 上游的 tag 固定为 alpha-r<code>，同一 commit 重复构建会撞 tag。
          # 这里加 commit 短 hash，允许同一版本号多次重跑而不冲突。
          SHA="$(git rev-parse --short HEAD)"
          echo "tag_name=alpha-r${{ steps.meta.outputs.version_code }}-$SHA" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        shell: bash
        run: |
          set -euo pipefail
          # 上游用 github.event.before，在手动触发时为空；这里用上一次 develop 提交。
          BEFORE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          if [[ -n "$BEFORE" ]]; then
            RANGE="$BEFORE..HEAD"
          else
            echo "::warning::找不到父提交，列出最近 20 条提交。"
            RANGE="-20"
          fi
          {
            echo "changelog<<BV_CHANGELOG_EOF"
            git log --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
            echo "BV_CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: Archive mapping
        shell: bash
        run: |
          set -euo pipefail
          MAPPING_DIR="app/build/outputs/mapping/defaultAlpha"
          if [[ -d "$MAPPING_DIR" ]]; then
            zip -rj mapping.zip "$MAPPING_DIR"
          else
            echo "::warning::没有生成 R8 mapping，跳过。"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alpha build artifacts
          path: ${{ steps.collect.outputs.files }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.collect.outputs.files }}
            mapping.zip
          tag_name: ${{ steps.tag_name.outputs.tag_name }}
          name: BV Alpha ${{ steps.meta.outputs.version_name }}
          prerelease: true
          body: ${{ env.changelog }}
          target_commitish: ${{ github.sha }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Alpha 构建完成"
            echo ""
            echo "- tag: \`${{ steps.tag_name.outputs.tag_name }}\`"
            echo "- versionCode: ${{ steps.meta.outputs.version_code }}"
            echo "- 发布地址: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag_name.outputs.tag_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
