name: 手动打包（Release，可选签名）

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: '包名后缀。留空 = bv2，填 bv3 = dev.aaa1115910.bv3'
        required: false
        default: ''
      sign:
        description: '是否使用仓库 secrets 中的签名材料'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Resolve application id
        id: appid
        shell: bash
        run: |
          set -euo pipefail
          # AppConfiguration.applicationId 依次读 BV_APPLICATION_ID 环境变量、
          # bv.applicationId 系统属性，都没给时回落到 bv2。
          SUFFIX="${{ github.event.inputs.application_id }}"
          if [[ -n "$SUFFIX" ]]; then
            APP_ID="dev.aaa1115910.${SUFFIX}"
          else
            APP_ID="dev.aaa1115910.bv2"
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          # 注意：step 内不能引用 steps.<id>.outputs（自己的输出尚未产生），
          # 这里用局部变量打印。
          echo "使用包名：$APP_ID"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up build
        uses: moekotori-yolo/bv/.github/actions/setup-build@feature-customisation-0001
        with:
          variant: release
          # 手动打包允许不带签名（自测场景），缺 secret 时退回 debug 签名。
          sign: ${{ inputs.sign && 'true' || 'false' }}
          google-services: 'true'
          # secrets 上下文只在 workflow 里可用，必须在这里展开后传给 composite action。
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          signing-properties: ${{ secrets.SIGNING_PROPERTIES }}
          sign-key: ${{ secrets.SIGN_KEY }}

      - name: Build signed release APK
        timeout-minutes: 60
        env:
          # applicationId 必须在 Gradle 执行时通过环境变量传入，
          # 见 AppConfiguration.resolveApplicationId()。
          BV_APPLICATION_ID: ${{ steps.appid.outputs.app_id }}
        run: |
          set -euo pipefail
          ./gradlew assembleDefaultRelease --stacktrace --no-daemon

      - name: Collect APK
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/default/release/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::没有找到 release APK。"
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${apks[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "产物："
          ls -la app/build/outputs/apk/default/release/

      - name: Read version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          META="app/build/outputs/apk/default/release/output-metadata.json"
          if [[ -f "$META" ]]; then
            echo "version_code=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_OUTPUT"
            echo "version_name=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive R8 mapping
        shell: bash
        run: |
          set -euo pipefail
          MAPPING_DIR="app/build/outputs/mapping/defaultRelease"
          if [[ -d "$MAPPING_DIR" ]]; then
            zip -rj mapping.zip "$MAPPING_DIR"
          else
            echo "::warning::没有生成 R8 mapping，跳过。"
          fi

      - name: Archive release APK
        uses: actions/upload-artifact@v4
        with:
          name: Release APK (${{ steps.appid.outputs.app_id }})
          path: ${{ steps.collect.outputs.files }}
          if-no-files-found: error
          retention-days: 30

      - name: Archive mapping
        uses: actions/upload-artifact@v4
        with:
          name: R8 mapping (${{ steps.appid.outputs.app_id }})
          path: mapping.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 手动打包完成"
            echo ""
            echo "- 包名: \`${{ steps.appid.outputs.app_id }}\`"
            echo "- versionCode: ${{ steps.meta.outputs.version_code }}"
            echo "- 签名: ${{ inputs.sign && '使用仓库 secrets' || '未要求（debug 签名）' }}"
            echo ""
            echo "在 Actions 页面下载 artifact 即可安装。"
          } >> "$GITHUB_STEP_SUMMARY"
