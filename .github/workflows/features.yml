name: Feature Build

# feature/** 分支的验证构建：只上传 artifact，不创建 Release。
# 与 alpha 的区别是不写 Releases —— 分支实验产物没必要占用 release 列表。
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'master'
      - 'develop'
      - 'feature/**'
  workflow_dispatch:
    inputs:
      application_id:
        description: >
          applicationId。必须与 GOOGLE_SERVICES_JSON 里的某个 package_name
          一致。留空则用 APPLICATION_ID secret。
        required: false
        default: ''

permissions:
  contents: read

# applicationId 必须与 GOOGLE_SERVICES_JSON 里的 package_name 一致，
# 否则 google-services 插件会报 "No matching client found for package name"。
env:
  BV_APPLICATION_ID: ${{ inputs.application_id || secrets.APPLICATION_ID || secrets.BV_APPLICATION_ID }}

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-feature:
    name: Build Feature APK
    runs-on: ubuntu-latest
    # 上游用 `if: github.repository == 'aaa1115910/bv'` 把 fork 整个跳过了。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          variant: alpha
          # 分支构建默认不要求签名材料：PR 来自 fork 时拿不到 secrets，
          # 让流水线直接失败反而挡掉正常的代码贡献。
          sign: 'false'
          google-services: 'stub'
          # 占位配置的 package_name 必须与实际 applicationId 一致，
          # 否则 google-services 插件同样报 "No matching client found"。
          stub-package: ${{ env.BV_APPLICATION_ID }}

      - name: Build APKs
        timeout-minutes: 60
        run: |
          set -euo pipefail
          ./gradlew assembleDefaultAlpha --stacktrace --no-daemon

      - name: Collect APKs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          alpha_apks=(app/build/outputs/apk/default/alpha/*.apk)
          debug_apks=(app/build/outputs/apk/default/debug/*.apk)
          if [[ ${#alpha_apks[@]} -eq 0 ]]; then
            echo "::error::没有找到 alpha APK。"
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${alpha_apks[@]}"
            if [[ ${#debug_apks[@]} -gt 0 ]]; then
              printf '%s\n' "${debug_apks[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "产物清单："
          ls -la app/build/outputs/apk/default/alpha/ app/build/outputs/apk/default/debug/ 2>/dev/null || true

      - name: Archive mapping
        shell: bash
        run: |
          set -euo pipefail
          MAPPING_DIR="app/build/outputs/mapping/defaultAlpha"
          if [[ -d "$MAPPING_DIR" ]]; then
            mkdir -p mapping
            cp -r "$MAPPING_DIR"/. mapping/
          else
            echo "::warning::没有生成 R8 mapping，跳过。"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Feature build artifacts
          path: ${{ steps.collect.outputs.files }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d mapping ]]; then
            echo "mapping/ 内容："
            ls -la mapping
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Feature 构建完成"
            echo ""
            echo "- 分支: \`${{ github.ref_name }}\`"
            echo "- 签名: 本 workflow 默认不做签名要求（缺 secret 时退回 debug 签名）"
          } >> "$GITHUB_STEP_SUMMARY"
