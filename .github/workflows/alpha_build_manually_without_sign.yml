name: 手动打包（Alpha，免签名）

# 面向没有签名凭据的场景：产物为 debug 签名，仅供自测，
# 不能覆盖安装正式签名的版本。
on:
  workflow_dispatch:
    inputs:
      application_id:
        description: >
          完整包名（如 com.moeneko.bv）。必须与 GOOGLE_SERVICES_JSON 里的某个
          package_name 一致。留空则用 APPLICATION_ID secret，再留空回落 bv2。
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-alpha:
    name: Build Unsigned Alpha APK
    runs-on: ubuntu-latest

    steps:
      - name: Resolve application id
        id: appid
        shell: bash
        run: |
          set -euo pipefail
          # 优先级：workflow input > APPLICATION_ID secret > AppConfiguration 默认值。
          SUFFIX="${{ github.event.inputs.application_id || secrets.APPLICATION_ID || secrets.BV_APPLICATION_ID }}"
          if [[ -n "$SUFFIX" ]]; then
            APP_ID="$SUFFIX"
          else
            APP_ID="dev.aaa1115910.bv2"
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          # step 内不能引用 steps.<id>.outputs（自己的输出尚未产生）。
          echo "使用包名：$APP_ID"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up build
        uses: moekotori-yolo/bv/.github/actions/setup-build@feature-customisation-0001
        with:
          variant: alpha
          # 这个 workflow 的意义就是免签名，明确不还原签名材料。
          sign: 'false'
          google-services: 'true'
          # secrets 上下文只在 workflow 里可用，必须在这里展开后传给 composite action。
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build alpha APK
        timeout-minutes: 60
        env:
          BV_APPLICATION_ID: ${{ steps.appid.outputs.app_id }}
        run: |
          set -euo pipefail
          ./gradlew assembleDefaultAlpha --stacktrace --no-daemon

      - name: Collect APKs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          alpha_apks=(app/build/outputs/apk/default/alpha/*.apk)
          debug_apks=(app/build/outputs/apk/default/debug/*.apk)
          if [[ ${#alpha_apks[@]} -eq 0 ]]; then
            echo "::error::没有找到 alpha APK。"
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${alpha_apks[@]}"
            if [[ ${#debug_apks[@]} -gt 0 ]]; then
              printf '%s\n' "${debug_apks[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "产物："
          ls -la app/build/outputs/apk/default/alpha/ app/build/outputs/apk/default/debug/ 2>/dev/null || true

      - name: Read version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          META="app/build/outputs/apk/default/alpha/output-metadata.json"
          if [[ -f "$META" ]]; then
            echo "version_code=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_OUTPUT"
            echo "version_name=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive R8 mapping
        shell: bash
        run: |
          set -euo pipefail
          MAPPING_DIR="app/build/outputs/mapping/defaultAlpha"
          if [[ -d "$MAPPING_DIR" ]]; then
            zip -rj mapping.zip "$MAPPING_DIR"
          else
            echo "::warning::没有生成 R8 mapping，跳过。"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alpha APK (${{ steps.appid.outputs.app_id }}, 未签名)
          path: ${{ steps.collect.outputs.files }}
          if-no-files-found: error
          retention-days: 14

      - name: Archive mapping
        uses: actions/upload-artifact@v4
        with:
          name: R8 mapping (${{ steps.appid.outputs.app_id }})
          path: mapping.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 免签名打包完成"
            echo ""
            echo "- 包名: \`${{ steps.appid.outputs.app_id }}\`"
            echo "- versionCode: ${{ steps.meta.outputs.version_code }}"
            echo ""
            echo "⚠️ 本 workflow **不做签名**："
            echo "- 产物为 debug 签名，无法覆盖安装已正式签名的版本"
            echo "- 仅供自测与提 issue 复现使用"
          } >> "$GITHUB_STEP_SUMMARY"
