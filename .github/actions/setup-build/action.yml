name: BV build setup
description: >
  BV 项目的公共构建准备步骤：还原 google-services.json / 签名材料、检出
  git 子模块（libs）、配置 Gradle 与 Android 构建缓存。
  供 release / alpha / feature / 手动打包各 workflow 复用。

inputs:
  variant:
    description: >
      要构建的 variant 名（release / alpha / debug / r8Test）。仅用于日志与
      缓存键区分，不影响还原逻辑。
    required: false
    default: release
  sign:
    description: >
      是否需要签名材料。false 时即使缺少 SIGNING_PROPERTIES / SIGN_KEY secret
      也不会失败 —— 构建会退回 debug 签名（app/build.gradle.kts 里
      signingConfig 仅在 signing.properties 存在时启用）。
    required: false
    default: 'true'
  google-services:
    description: >
      how to handle app/google-services.json:
        'secret'   - 从 google-services-json input 还原真实配置
        'skip'     - 完全不碰该文件（仅当仓库里已存在它时可用）
        'stub'     - 生成一份占位配置，让 google-services 插件在无凭据时也能构建
      firebase 依赖占位配置会降级，但 plugin 本身不会因缺文件而失败。
    required: false
    default: 'secret'
  # 注意：composite action 的 manifest 里没有 secrets / gradle 上下文，
  # ${{ secrets.* }} 只能写在调用方 workflow 里。因此 secret 必须由调用方
  # 通过下面这几个 input 显式传进来。
  google-services-json:
    description: 'google-services.json 的明文内容（通常来自 secrets.GOOGLE_SERVICES_JSON）'
    required: false
    default: ''
  stub-package:
    description: "google-services='stub' 时占位配置使用的 package_name"
    required: false
    default: 'dev.aaa1115910.bv2'
  signing-properties:
    description: 'signing.properties 的 base64 编码内容（通常来自 secrets.SIGNING_PROPERTIES）'
    required: false
    default: ''
  sign-key:
    description: 'key.jks 的 base64 编码内容（通常来自 secrets.SIGN_KEY）'
    required: false
    default: ''

runs:
  # LOCAL_REF_PROBE_V2: 该标记用于验证本地 action 是否拿到最新版本。
  # 若 CI 日志出现此行，说明 uses: ./ 形式在同一次提交内可正确解析。
  using: composite
  steps:
    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    # 共享 action 里不能假设工作目录，git checkout 的 action 已经 cd 到仓库根，
    # 但这里显式声明一次，避免后续相对路径在不同调用点下出错。
    - name: Report build context
      shell: bash
      run: |
        set -euo pipefail
        echo "repo      : ${{ github.repository }}"
        echo "ref       : ${{ github.ref_name }}"
        echo "variant   : ${{ inputs.variant }}"
        echo "sign      : ${{ inputs.sign }}"
        echo "g-services: ${{ inputs.google-services }}"
        echo "submodules:"
        git submodule status || true

    - name: Restore google-services.json
      if: inputs.google-services == 'secret'
      shell: bash
      env:
        # 用 printf 而不是 echo：JSON 里常有多行和以 - 开头的字段，
        # echo 在部分 shell 下会吞掉转义。
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        set -euo pipefail
        if [[ -z "${GOOGLE_SERVICES_JSON}" ]]; then
          echo "::error::google-services='secret' 但未提供 google-services-json。"
          echo "::error::改用 'stub' 生成占位配置，或 'skip' 跳过。"
          exit 1
        fi
        mkdir -p app
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        echo "google_services_bytes=$(wc -c < app/google-services.json | tr -d ' ')"
        # 打印文件里实际配置的包名。google-services.json 本身不是密钥
        # （真正的私钥在 service account 里），因此只回显 package_name 列表是安全的；
        # 但仍不打印 api_key / current_key 等字段。
        echo "google_services_packages=$(grep -o '"package_name": *"[^"]*"' app/google-services.json | sed 's/.*"\([^"]*\)"$/\1/' | sort -u | tr '\n' ',' )"
        # 校验是否合法 JSON，避免把粘贴残缺的内容喂给 Gradle
        if command -v jq >/dev/null 2>&1; then
          if jq -e . app/google-services.json >/dev/null 2>&1; then
            echo "google_services_json=valid"
          else
            echo "::error::GOOGLE_SERVICES_JSON 不是合法 JSON，可能复制时被截断。"
            exit 1
          fi
        fi

    # google-services 插件在 app/build.gradle.kts 里是无条件 apply 的，
    # 文件缺失会直接报 "File google-services.json is missing"，无法构建。
    # 占位配置让无凭据环境（CI、fork PR）也能编译通过：
    # project_id / api key 都是占位值，Firebase 与 Crashlytics 会自动降级。
    - name: Write stub google-services.json
      if: inputs.google-services == 'stub'
      shell: bash
      env:
        STUB_PACKAGE: ${{ inputs.stub-package }}
      run: |
        set -euo pipefail
        PKG="${STUB_PACKAGE:-dev.aaa1115910.bv2}"
        echo "::warning::使用占位 google-services.json，package_name=$PKG"
        echo "::warning::Firebase 与 Crashlytics 上传不可用，仅供编译验证。"
        mkdir -p app
        # 整块 JSON 必须与 run: 保持相同缩进，否则 YAML 会认为 block scalar
        # 提前结束（实测踩过）。先用引号 heredoc 原样写入，再用 sed 去缩进并替换包名。
        cat > app/google-services.json <<'STUB_EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "bv-stub",
            "storage_bucket": "bv-stub.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": __STUB_PACKAGE__
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        STUB_EOF
        sed -i 's/^[[:space:]]*//; s/__STUB_PACKAGE__/"'"$PKG"'"/' app/google-services.json
        if command -v jq >/dev/null 2>&1; then
          if jq -e . app/google-services.json >/dev/null 2>&1; then
            echo "stub_google_services=valid"
          else
            echo "::error::生成的占位 google-services.json 不是合法 JSON。"
            cat app/google-services.json
            exit 1
          fi
        else
          echo "stub_google_services=written"
        fi

    - name: Skip google-services.json
      if: inputs.google-services == 'skip'
      shell: bash
      run: |
        set -euo pipefail
        # 仅当仓库里本来就有该文件时才可行（例如开发者本地已放置）。
        if [[ -f app/google-services.json ]]; then
          echo "google_services=skip_but_present"
        else
          echo "::warning::google-services='skip' 且文件不存在。"
          echo "::warning::google-services 插件仍会应用并因缺文件失败，建议改用 'stub'。"
        fi

    # signing.properties 与 key.jks 都按 base64 存放。
    # 上游旧写法是 `echo $SECRET > f && base64 -Dd -i f > out`，
    # 依赖 echo 不吞内容、且 -i 忽略垃圾字符，跨 shell/换行时容易静默产出坏文件。
    # 这里统一改成直接管道解码，并用 keytool 校验 keystore 真的可用。
    - name: Restore signing materials
      if: inputs.sign == 'true'
      shell: bash
      env:
        SIGNING_PROPERTIES: ${{ inputs.signing-properties }}
        SIGN_KEY: ${{ inputs.sign-key }}
      run: |
        set -euo pipefail

        if [[ -z "${SIGNING_PROPERTIES}" && -z "${SIGN_KEY}" ]]; then
          echo "::warning::SIGNING_PROPERTIES 与 SIGN_KEY 均未配置，本次构建将使用 debug 签名。"
          echo "::warning::产出的 APK 不能覆盖安装已正式签名的版本，仅供自测。"
          rm -f signing.properties key.jks
          exit 0
        fi

        if [[ -z "${SIGNING_PROPERTIES}" ]]; then
          echo "::error::配置了 SIGN_KEY 但缺少 SIGNING_PROPERTIES，无法定位 keystore。"
          exit 1
        fi
        if [[ -z "${SIGN_KEY}" ]]; then
          echo "::error::配置了 SIGNING_PROPERTIES 但缺少 SIGN_KEY。"
          exit 1
        fi

        # base64 是单行大字符串，直接走 stdin。
        # 用 --decode（不是 -d 之外的 GNU 专有参数）保证跨发行版可用；
        # 失败时不立即退出，先把实际拿到的内容长度打出来再决定。
        DECODED_PROPS_LEN=0
        DECODED_KEY_LEN=0
        if ! printf '%s' "$SIGNING_PROPERTIES" | base64 --decode > signing.properties 2>/tmp/b64err1; then
          echo "::error::SIGNING_PROPERTIES base64 解码失败："
          cat /tmp/b64err1
          exit 1
        fi
        if ! printf '%s' "$SIGN_KEY" | base64 --decode > key.jks 2>/tmp/b64err2; then
          echo "::error::SIGN_KEY base64 解码失败："
          cat /tmp/b64err2
          exit 1
        fi

        DECODED_PROPS_LEN="$(wc -c < signing.properties | tr -d ' ')"
        DECODED_KEY_LEN="$(wc -c < key.jks | tr -d ' ')"
        # 日志一律用 ASCII：runner 的 bash locale 下非 ASCII 输出可能被截断，
        # 之前的中文诊断行就整段消失过，导致误判为"代码没生效"。
        echo "decoded_props_bytes=$DECODED_PROPS_LEN"
        echo "decoded_key_bytes=$DECODED_KEY_LEN"
        echo "key_jks_head8=$(od -An -tx1 -N8 key.jks | tr -s ' ')"
        echo "key_jks_md5=$(md5sum key.jks | cut -d' ' -f1)"
        echo "local_ref: bytes=2704 md5=c9f1b1d3d73cc97a591040884697eb38"

        if [[ "$DECODED_PROPS_LEN" -eq 0 ]]; then
          echo "::error::signing.properties 解码后为空。secret 需要存 base64 编码后的内容。"
          exit 1
        fi
        if [[ ! -s key.jks ]]; then
          echo "::error::key.jks 解码后为空。secret 需要存 base64 编码后的内容。"
          exit 1
        fi

        # keystore 是二进制，用 file + keytool 双重确认解码正确，
        # 避免把损坏的 jks 喂给 Gradle 后得到一个难懂的签名错误。
        echo "keystore_type=$(file -b key.jks 2>/dev/null || echo 'file(1) unavailable')"
        KEYSTORE_PASS="$(sed -n 's/^keystore\.pwd=//p' signing.properties | head -n1)"
        KEY_ALIAS="$(sed -n 's/^keystore\.alias=//p' signing.properties | head -n1)"
        # 只回显 alias 与密码长度，绝不回显密码本身。
        echo "parsed_alias='${KEY_ALIAS}' parsed_pass_len=${#KEYSTORE_PASS}"

        if [[ -n "$KEYSTORE_PASS" && -n "$KEY_ALIAS" ]]; then
          if keytool -list -keystore key.jks -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" >/tmp/kt.out 2>&1; then
            echo "keystore_ok alias=$KEY_ALIAS"
          else
            echo "::error::keystore cannot be opened with the parsed password/alias."
            echo "::error::Verify that the secrets come from the same keytool -genkeypair run."
            echo "--- keytool raw output ---"
            cat /tmp/kt.out
            echo "--- signing.properties keys (values hidden) ---"
            sed 's/=.*/=***/' signing.properties
            exit 1
          fi
        else
          echo "::warning::signing.properties 中未解析到 keystore.pwd / keystore.alias，跳过校验。"
        fi

    - name: Restore submodules
      shell: bash
      run: |
        set -euo pipefail
        # libs 子模块（libVLC / ffmpeg / av1 / media3Container）是构建必需项。
        # checkout 已带 submodules: true，这里再做一次兜底并显式拉取，
        # 避免上游 tag 推送时子模块指针未同步导致构建中途才失败。
        if [[ -f .gitmodules ]]; then
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          echo "子模块状态："
          git submodule status --recursive
        fi

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # 开启后依赖图会自动上报到 GitHub，安全审计里能看到新增依赖。
        dependency-graph: generate-and-submit
        # 缓存命中时把 Gradle daemon 一起复用，省掉冷启动的十几秒。
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # 刻意不使用 android-actions/setup-android：它在 v3 会执行
    # `sdkmanager tools`，而该包已从新版 Android SDK 仓库移除，导致
    # "Failed to find package 'tools'" 直接失败。
    # GitHub 的 ubuntu runner 已预装 Android SDK（含 cmdline-tools、
    # platform-tools、build-tools），Gradle 的 AGP 会在需要时自动补装
    # compileSdk 对应的 platform。
    # 额外缓存 SDK 里体积大、重下慢的组件。
    - name: Cache Android SDK packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }}/platforms
          ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }}/build-tools
          ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }}/platform-tools
        key: android-sdk-${{ runner.os }}-${{ inputs.variant }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml', 'buildSrc/src/main/kotlin/AppConfiguration.kt') }}
        restore-keys: |
          android-sdk-${{ runner.os }}-${{ inputs.variant }}-

    # 让后续 ./gradlew 调用能复用 setup-gradle 装好的 distribution。
    - name: Accept Android SDK licenses
      shell: bash
      run: |
        set -euo pipefail
        # runner 镜像预装了 sdkmanager，但没有预接受 license；
        # AGP 自动补装 platform 时会因此交互式卡住。
        # 这里用 yes 预先接受，失败不阻断（部分镜像本就已接受）。
        SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$SDKMANAGER" ]]; then
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
        fi
        if [[ -n "$SDKMANAGER" && -x "$SDKMANAGER" ]]; then
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || \
            echo "::warning::sdkmanager --licenses 未成功，若后续构建卡在 license 请检查 SDK 镜像。"
        else
          echo "::warning::未找到 sdkmanager，跳过 license 接受。"
        fi

    - name: Report environment
      shell: bash
      run: |
        set -euo pipefail
        # LOCAL_REF_PROBE_V2 —— 该行会出现在 CI 日志里。
        # 若看不到，说明 uses: ./ 形式的本地 action 拿到了旧版本（GitHub 缓存）。
        echo "LOCAL_REF_PROBE_V2 active"
        java -version 2>&1 | head -n1
        # composite action 内没有 gradle 上下文（gradle.cache-state 不可用），
        # 缓存命中情况由 setup-gradle 自己写进 Actions Job Summary。
        echo "variant   : ${{ inputs.variant }}"
        echo "signing   : ${{ inputs.sign }}"
        echo "g-services: ${{ inputs.google-services }}"
